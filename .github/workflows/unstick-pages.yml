name: One-time recovery for stuck ChewPlay Pages deployment
on:
  push:
    paths:
      - '.github/workflows/unstick-pages.yml'

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the stale deployment reported by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/cdc293f62452ebbe5196c94066f9179e028f08e2/cancel"
          echo 'Requested cancellation of stale Pages deployment cdc293f.'
