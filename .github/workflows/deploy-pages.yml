name: Deploy ChewPlay Web V0.1 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chewplay-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the original V0.1
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble same-origin MediaPipe assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/mediapipe/wasm _site/assets/mediapipe/model
          cp index.html _site/index.html
          touch _site/.nojekyll
          # Use a known published version, pinned and copied into this site's origin.
          package_archive="$(npm pack @mediapipe/tasks-vision@0.10.21 --silent)"
          mkdir -p _mediapipe_package
          tar -xzf "$package_archive" -C _mediapipe_package
          cp _mediapipe_package/package/vision_bundle.mjs _site/assets/mediapipe/vision_bundle.mjs
          cp -R _mediapipe_package/package/wasm/. _site/assets/mediapipe/wasm/
          test -s _site/assets/mediapipe/wasm/vision_wasm_internal.wasm
          test -s _site/assets/mediapipe/wasm/vision_wasm_internal.js
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            --output _site/assets/mediapipe/model/face_landmarker.task
          test "$(wc -c < _site/assets/mediapipe/model/face_landmarker.task)" -gt 100000
          echo "Self-hosted MediaPipe: $(du -h _site/assets/mediapipe/vision_bundle.mjs | cut -f1) bundle, $(du -sh _site/assets/mediapipe/wasm | cut -f1) wasm, $(du -h _site/assets/mediapipe/model/face_landmarker.task | cut -f1) model"
      - name: Upload the static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
